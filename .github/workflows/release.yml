name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  REPO_OWNER: straps-eq

jobs:
  build-loginserver:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: ./loginserver
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/eqemu-loginserver:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/eqemu-loginserver:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/eqemu-web:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/eqemu-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: [build-loginserver, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Quick Start

            ```bash
            git clone https://github.com/straps-eq/eqemulator-loginserver.git
            cd eqemulator-loginserver
            chmod +x scripts/setup.sh
            ./scripts/setup.sh
            # Edit .env with your domain
            docker compose -f docker-compose.release.yml up -d
            ```

            ### Docker Images
            - `ghcr.io/straps-eq/eqemu-loginserver:${{ steps.version.outputs.tag }}`
            - `ghcr.io/straps-eq/eqemu-web:${{ steps.version.outputs.tag }}`
