name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: coderabbitai/ai-pr-reviewer@516a0728038a4363e7eb4ed6ee2cc23660a2a0a3 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: false
          review_simple_changes: false
          review_comment_lgtm: false
          openai_light_model: gpt-4o-mini
          openai_heavy_model: gpt-4o
          system_message: |
            You are a security-focused code reviewer for a Next.js web application
            that handles authentication, federation, and EverQuest login infrastructure.
            Pay special attention to:
            - Authentication and authorization bypasses
            - Input validation and SQL injection
            - Secret handling (no hardcoded credentials)
            - CSP and security header changes
            - Rate limiting on auth endpoints
            - TypeScript type safety
