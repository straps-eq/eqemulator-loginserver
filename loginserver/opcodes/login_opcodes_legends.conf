# EverQuest Legends client (eqgame.exe built Oct 12 2026, ToB #630 code line).
# The client added a login message type at 0x18, so every server-to-client
# opcode from 0x18 up is ToB's value + 1. Client-to-server opcodes are ToB's.
# Client-to-server 0x18 (login screen text) is left unmapped on purpose: the
# loginserver drops it without a reply. Server-to-client 0x35 is never sent.
OP_SessionReady=0x0001
OP_Login=0x0002
OP_ServerListRequest=0x0004
OP_PlayEverquestRequest=0x000d
OP_EnterChat=0x000f
OP_PollResponse=0x0011
OP_SystemFingerprint=0x0016
OP_ChatMessage=0x0019
OP_LoginAccepted=0x001a
OP_ServerListResponse=0x001b
OP_PlayEverquestResponse=0x0024
OP_Poll=0x002b
OP_ExpansionList=0x0032
